<g fill="#D8D2E5" font-family="Arial" font-size="13"><text x="308" y="307">The selected documents define three main requirements:</text><text x="308" y="334">• Preserve traceable source context for every answer.</text><text x="308" y="359">• Retrieve relevant passages before generating a response.</text><text x="308" y="384">• Keep document references available for verification.</text></g>
