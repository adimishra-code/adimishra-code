<svg xmlns="http://www.w3.org/2000/svg" width="900" height="100" viewBox="0 0 900 100" role="img" aria-label="GitHub statistics"><defs>
  <linearGradient id="cardbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#151126"/><stop offset="1" stop-color="#0D0A19"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#C084FC"/></linearGradient>
  <linearGradient id="accentV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C084FC"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
  <radialGradient id="glowTL" cx="0" cy="0" r="1"><stop offset="0" stop-color="#A855F7" stop-opacity="0.22"/><stop offset="1" stop-color="#A855F7" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowBR" cx="1" cy="1" r="1"><stop offset="0" stop-color="#7C3AED" stop-opacity="0.20"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#30234A" stroke-opacity="0.35" stroke-width="1"/></pattern>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10"/></filter>
  
</defs><clipPath id="clip"><rect x="1" y="1" width="898" height="98" rx="20"/></clipPath><g clip-path="url(#clip)"><rect width="900" height="100" fill="url(#cardbg)"/><rect width="900" height="100" fill="url(#grid)" opacity="0.5"/><rect width="900" height="100" fill="url(#glowTL)"/><rect width="900" height="100" fill="url(#glowBR)"/></g><rect x="1" y="1" width="898" height="98" rx="20" fill="none" stroke="#A855F7" stroke-opacity="0.30" stroke-width="3" filter="url(#soft)"/><rect x="1" y="1" width="898" height="98" rx="20" fill="none" stroke="#30234A" stroke-width="1.5"/><rect x="36" y="1" width="96" height="3" rx="1.5" fill="url(#accent)"/><rect x="40" y="32" width="5" height="26" rx="2.5" fill="url(#accentV)"/><text x="58" y="52" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="start" >GitHub Statistics</text><text x="58" y="76" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#858096" text-anchor="start" >Live activity pulled directly from my GitHub account</text></svg>