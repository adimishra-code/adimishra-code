<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="300" viewBox="0 0 1600 300" role="img" aria-labelledby="title desc">
<title id="title">Purple and black futuristic developer banner</title>
<desc id="desc">An abstract dark developer banner with violet gradients, luminous orbital lines, terminal marks, and a subtle grid.</desc>
<defs>
