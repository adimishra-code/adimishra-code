<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="500" viewBox="0 0 1920 500" role="img" aria-labelledby="title desc">
  <title id="title">Aditya Mishra — Full-stack developer and AI systems builder</title>
  <desc id="desc">A dark, modern developer profile banner with Aditya Mishra's name, engineering focus, and a terminal-inspired code panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#0B0E14"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#91F2C3"/>
      <stop offset="0.52" stop-color="#71D9FF"/>
      <stop offset="1" stop-color="#B7A3FF"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#71D9FF" stop-opacity="0.19"/>
      <stop offset="1" stop-color="#91F2C3" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8CA4C4" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <clipPath id="panelClip"><rect x="1090" y="82" width="730" height="340" rx="22"/></clipPath>
  </defs>

  <rect width="1920" height="500" rx="28" fill="url(#bg)"/>
  <rect width="1920" height="500" rx="28" fill="url(#grid)"/>
  <ellipse cx="1635" cy="110" rx="360" ry="250" fill="#71D9FF" opacity="0.10" filter="url(#softBlur)"/>
  <ellipse cx="260" cy="470" rx="420" ry="180" fill="#91F2C3" opacity="0.06" filter="url(#softBlur)"/>
  <rect x="1.5" y="1.5" width="1917" height="497" rx="27" fill="none" stroke="#344255" stroke-opacity="0.75" stroke-width="2"/>

  <!-- Left / identity -->
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif">
    <rect x="86" y="78" width="386" height="42" rx="21" fill="#17232B" stroke="#35534D" stroke-width="1.5"/>
    <circle cx="111" cy="99" r="6" fill="#91F2C3"/>
    <text x="132" y="105" fill="#B4F9D8" font-family="'SFMono-Regular', Consolas, monospace" font-size="17" font-weight="700" letter-spacing="2.1">FULL-STACK / AI / SECURITY</text>

    <text x="82" y="232" fill="#F3F6FA" font-size="91" font-weight="800" letter-spacing="-4">Aditya Mishra</text>
    <rect x="87" y="260" width="110" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="86" y="315" fill="#B8C3D1" font-size="27" font-weight="500">Building useful software, intelligent systems</text>
    <text x="86" y="353" fill="#B8C3D1" font-size="27" font-weight="500">and secure-by-design experiences.</text>

    <g transform="translate(86 394)">
      <rect width="286" height="48" rx="10" fill="#151D28" stroke="#344255"/>
      <text x="20" y="30" fill="#D5DDE7" font-size="18" font-weight="600">B.Tech IT  <tspan fill="#708198">/</tspan>  GBU</text>
      <rect x="302" width="235" height="48" rx="10" fill="#151D28" stroke="#344255"/>
      <text x="322" y="30" fill="#D5DDE7" font-size="18" font-weight="600">Greater Noida, IN</text>
      <rect x="553" width="270" height="48" rx="10" fill="#17251F" stroke="#3E6857"/>
      <circle cx="577" cy="24" r="5" fill="#91F2C3"/>
      <text x="594" y="30" fill="#B4F9D8" font-size="18" font-weight="700">Open to opportunities</text>
    </g>
  </g>

  <!-- Right / terminal card -->
  <g clip-path="url(#panelClip)">
    <rect x="1090" y="82" width="730" height="340" rx="22" fill="#0A0F16" stroke="#36465A" stroke-width="2"/>
    <rect x="1090" y="82" width="730" height="58" fill="#151E2A"/>
    <path d="M1090 140H1820" stroke="#344255" stroke-width="1.5"/>
    <circle cx="1125" cy="111" r="7" fill="#FF7B72"/>
    <circle cx="1151" cy="111" r="7" fill="#F2C879"/>
    <circle cx="1177" cy="111" r="7" fill="#91F2C3"/>
    <text x="1210" y="118" fill="#AAB8C9" font-family="'SFMono-Regular', Consolas, monospace" font-size="16" font-weight="600" letter-spacing="1.2">~/aditya/build.config.ts</text>

    <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="19">
      <text x="1135" y="194" fill="#6F8198">01</text>
      <text x="1180" y="194" fill="#C9D4E2"><tspan fill="#B7A3FF">const</tspan> <tspan fill="#91F2C3">builder</tspan> = {</text>

      <text x="1135" y="239" fill="#6F8198">02</text>
      <text x="1180" y="239" fill="#C9D4E2">  focus: [</text>
      <text x="1260" y="278" fill="#91F2C3">"full-stack systems",</text>
      <text x="1260" y="317" fill="#91F2C3">"AI-powered products",</text>
      <text x="1260" y="356" fill="#91F2C3">"application security"</text>
      <text x="1135" y="395" fill="#6F8198">03</text>
      <text x="1180" y="395" fill="#C9D4E2">  ]</text>
      <text x="1280" y="395" fill="#B7A3FF">;</text>
    </g>
    <path d="M1765 180V205" stroke="#71D9FF" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  </g>

  <path d="M1040 68V432" stroke="#344255" stroke-opacity="0.6" stroke-dasharray="4 10"/>
  <circle cx="1040" cy="250" r="5" fill="#71D9FF"/>
</svg>
