<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="Aditya Mishra - Full-Stack &amp; AI Systems Engineer">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#30363d"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Main Background Container -->
  <rect x="1" y="1" width="998" height="238" rx="12" fill="url(#cardBg)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Left: Profile Details -->
  <!-- Status Badge -->
  <g transform="translate(48, 38)">
    <rect width="180" height="26" rx="13" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#3fb950"/>
    <text x="26" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#7ee787" letter-spacing="0.5">SWE &amp; AI SYSTEMS</text>
  </g>

  <!-- Name -->
  <text x="48" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5">
    Aditya Mishra
  </text>

  <!-- Tagline -->
  <text x="48" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8b949e">
    Full-Stack Developer · Autonomous AI Agents · App Security
  </text>

  <!-- Metadata Tags -->
  <g transform="translate(48, 172)">
    <!-- Location Pill -->
    <rect x="0" y="0" width="135" height="26" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="12" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#c9d1d9">📍 Greater Noida, IN</text>

    <!-- Education Pill -->
    <rect x="145" y="0" width="170" height="26" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="157" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#c9d1d9">🎓 B.Tech IT @ GBU</text>
  </g>

  <!-- Right: Architecture Pipeline Visual -->
  <g transform="translate(620, 32)">
    <!-- Container Box -->
    <rect width="332" height="176" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

    <!-- Header bar -->
    <path d="M 0 10 C 0 4.5 4.5 0 10 0 L 322 0 C 327.5 0 332 4.5 332 10 L 332 30 L 0 30 Z" fill="#161b22"/>
    <line x1="0" y1="30" x2="332" y2="30" stroke="#30363d" stroke-width="1"/>
    <circle cx="16" cy="15" r="3.5" fill="#f85149"/>
    <circle cx="30" cy="15" r="3.5" fill="#e3b341"/>
    <circle cx="44" cy="15" r="3.5" fill="#3fb950"/>
    <text x="64" y="19" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="600" fill="#8b949e">PIPELINE ARCHITECTURE</text>

    <!-- Stage 1: Ingestion -->
    <g transform="translate(16, 46)">
      <rect width="138" height="48" rx="6" fill="#161b22" stroke="#38bdf8" stroke-width="1"/>
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#ffffff">1. Static AST Audit</text>
      <text x="12" y="36" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#8b949e">Manifest &amp; Syntax</text>
    </g>

    <!-- Arrow 1 to 2 -->
    <path d="M 158 70 L 174 70" stroke="#58a6ff" stroke-width="2"/>
    <polygon points="178,70 172,66 172,74" fill="#58a6ff"/>

    <!-- Stage 2: Sandbox -->
    <g transform="translate(178, 46)">
      <rect width="138" height="48" rx="6" fill="#161b22" stroke="#a371f7" stroke-width="1"/>
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#ffffff">2. Sandbox VM</text>
      <text x="12" y="36" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#8b949e">Playwright Isolated</text>
    </g>

    <!-- Stage 3: Risk Engine -->
    <g transform="translate(16, 110)">
      <rect width="300" height="48" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
      <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#7ee787">3. Multi-Signal Scoring Engine</text>
      <text x="14" y="36" font-family="'SF Mono', Consolas, monospace" font-size="9.5" fill="#c9d1d9">Weighted 0–100 Threat Index · Rules &amp; LLM Review</text>
    </g>
  </g>
</svg>
