<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Aditya Mishra - Software Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f1524"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="220" rx="10" fill="url(#bg)"/>
  <rect width="1000" height="220" rx="10" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="999" height="219" rx="10" fill="none" stroke="#1e293b" stroke-opacity="0.8"/>

  <!-- Status / Pill -->
  <g transform="translate(60, 46)">
    <circle cx="4" cy="4" r="3" fill="#10b981"/>
    <text x="16" y="7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1.4">FULL-STACK &amp; AI SYSTEMS</text>
  </g>

  <!-- Title -->
  <text x="60" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#f8fafc" letter-spacing="-0.5">Aditya Mishra</text>

  <!-- Subtitle -->
  <text x="60" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
    Building full-stack products, autonomous agent pipelines, and application security tooling.
  </text>

  <!-- Right-side Minimal Focus Card -->
  <g transform="translate(730, 38)">
    <rect width="210" height="144" rx="8" fill="#0c1220" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Consolas, monospace" font-size="10" font-weight="600" fill="#64748b" letter-spacing="1">CURRENT FOCUS</text>
    
    <text x="20" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Sentinel</text>
    <text x="20" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">AI Trust &amp; Safety Platform</text>

    <line x1="20" y1="88" x2="190" y2="88" stroke="#1e293b" stroke-width="1"/>

    <text x="20" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Extension Guard</text>
    <text x="20" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Browser Extension Security</text>
  </g>
</svg>
