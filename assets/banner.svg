<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Aditya Mishra, software developer. Full-stack products, AI agents and security.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#171c45"/>
    </linearGradient>
    <radialGradient id="glowR" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowL" cx="0.05" cy="1" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" fill-opacity="0.16"/>
    </pattern>
    <clipPath id="round"><rect width="1000" height="280" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#dots)"/>
    <rect width="1000" height="280" fill="url(#glowR)"/>
    <rect width="1000" height="280" fill="url(#glowL)"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="279" rx="14" fill="none" stroke="#2b3270" stroke-opacity="0.8"/>

  <!-- text block -->
  <text x="64" y="96" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="3.2" fill="#22d3ee">SOFTWARE DEVELOPER</text>
  <text x="62" y="162" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#f8fafc">Aditya Mishra</text>
  <rect x="64" y="182" width="96" height="4" rx="2" fill="url(#accent)"/>
  <text x="64" y="224" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#cbd5e1">Full-stack products  ·  AI agents  ·  Security</text>

  <!-- code window -->
  <g transform="translate(640 52)">
    <rect width="318" height="176" rx="12" fill="#0d1230" stroke="#2f3880"/>
    <rect width="318" height="34" rx="12" fill="#141a45"/>
    <rect y="22" width="318" height="12" fill="#141a45"/>
    <circle cx="20" cy="17" r="5" fill="#ff5f57"/>
    <circle cx="38" cy="17" r="5" fill="#febc2e"/>
    <circle cx="56" cy="17" r="5" fill="#28c840"/>
    <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14">
      <text x="20" y="68"><tspan fill="#c084fc">const</tspan><tspan fill="#e2e8f0"> developer</tspan><tspan fill="#94a3b8"> = {</tspan></text>
      <text x="40" y="92"><tspan fill="#7dd3fc">name:</tspan><tspan fill="#86efac"> "Aditya Mishra"</tspan><tspan fill="#94a3b8">,</tspan></text>
      <text x="40" y="116"><tspan fill="#7dd3fc">stack:</tspan><tspan fill="#86efac"> ["MERN", "FastAPI"]</tspan><tspan fill="#94a3b8">,</tspan></text>
      <text x="40" y="140"><tspan fill="#7dd3fc">focus:</tspan><tspan fill="#86efac"> ["AI agents", "Security"]</tspan><tspan fill="#94a3b8">,</tspan></text>
      <text x="20" y="164"><tspan fill="#94a3b8">};</tspan></text>
      <rect x="46" y="151" width="8" height="16" fill="#22d3ee">
        <animate attributeName="opacity" values="1;0" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
